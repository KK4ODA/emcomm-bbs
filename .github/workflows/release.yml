name: Release

# Push a tag like v1.7.0 (RELEASE.bat does this and creates the GitHub
# release from the CHANGELOG) and this workflow builds the Windows installer
# and portable zip and attaches them, with checksums, to that release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          PYVER=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('version.py').read()).group(1))")
          if [ "$PYVER" != "$VER" ]; then echo "::error::tag v$VER does not match version.py ($PYVER); use RELEASE.bat"; exit 1; fi
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests
      - name: Build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging/emcomm_bbs.spec
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/Emcomm BBS/"
          Compress-Archive -Path "dist/Emcomm BBS/*" -DestinationPath "dist/Emcomm-BBS-$env:VER-windows-x64-portable.zip"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VER packaging\emcomm_bbs.iss
          Get-ChildItem dist
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum *.exe *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
